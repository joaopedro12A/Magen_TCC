<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YESOD – protótipo 3D (MAGEN)</title>
<style>
:root{--bg:#e9edf2;--bg2:#f7f9fb;--fg:#1b1f24;--card:rgba(255,255,255,.95);--bd:#cfd6df;--ac:#1d4fb3;--mut:#5d6875;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f14;--bg2:#1a222c;--fg:#e8ecf1;--card:rgba(24,30,38,.95);--bd:#2e3844;--ac:#6aa8ff;--mut:#97a3b1}}
:root[data-theme="dark"]{--bg:#0b0f14;--bg2:#1a222c;--fg:#e8ecf1;--card:rgba(24,30,38,.95);--bd:#2e3844;--ac:#6aa8ff;--mut:#97a3b1}
html,body{height:100%;margin:0;background:radial-gradient(120% 90% at 50% 30%,var(--bg2),var(--bg));color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#v{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
canvas{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px}
.top{position:absolute;left:12px;top:12px;right:12px;pointer-events:none}
.top .card{display:inline-block;padding:10px 14px}
.top h1{font-size:18px;margin:0;letter-spacing:.08em}
.top small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.dock{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.chip i{font-style:normal;display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--ac);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-right:7px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sl{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13px}
.sl input{flex:1;accent-color:var(--ac);min-width:80px}
.pin{position:absolute;left:0;top:0;will-change:transform;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--ac);color:#fff;font:700 13px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer;z-index:5;user-select:none}
.pin.sel{outline:3px solid var(--ac);outline-offset:2px}
#bub{position:absolute;max-width:240px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;z-index:6;display:none;cursor:pointer}
#bub b{display:block;margin-bottom:3px}
</style>
</head>
<body>
<div id="v">
  <div class="top"><div class="card"><h1>YESOD</h1><small>MAGEN · protótipo 3D · arraste para girar, pinça para zoom</small></div></div>
  <div class="dock">
    <div class="chips" id="chips"></div>
    <div class="card sl"><button id="bx">Explodir</button><span>Montado</span><input id="sl" type="range" min="0" max="100" value="0"><span>Aberto</span></div>
    <div class="row">
      <button data-v="f">Frente</button><button data-v="l">Lateral</button><button data-v="i">3D</button>
      <button id="ba">Girar</button><button id="bn" class="on">Notas</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const el=document.getElementById('v');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFShadowMap;R.shadowMap.autoUpdate=false;R.shadowMap.needsUpdate=true;
el.insertBefore(R.domElement,el.firstChild);
const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(38,1,0.1,300);
C.position.set(19,9,33);
const O=new THREE.OrbitControls(C,R.domElement);
O.enableDamping=true;O.target.set(0,-1.2,2);O.autoRotateSpeed=1.5;O.maxDistance=90;O.minDistance=6;

// ambiente procedural para reflexos
const envS=new THREE.Scene();
const sg=new THREE.SphereGeometry(40,32,16),sp=sg.attributes.position,cl=[];
for(let i=0;i<sp.count;i++){const k=.25+.75*(sp.getY(i)/40*.5+.5);cl.push(k*.8,k*.85,k*.95);}
sg.setAttribute('color',new THREE.Float32BufferAttribute(cl,3));
envS.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({side:THREE.BackSide,vertexColors:true})));

panel(20,12,10,25,20,8);panel(10,20,-30,5,10,4);panel(25,6,0,-10,-25,3);
S.environment=new THREE.PMREMGenerator(R).fromScene(envS,.04).texture;
S.add(new THREE.HemisphereLight(0xffffff,0x667788,.25));

dl.shadow.mapSize.set(1024,1024);dl.shadow.bias=-.0005;
Object.assign(dl.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:70});S.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.ShadowMaterial({opacity:.22}));
floor.rotation.x=-Math.PI/2;floor.position.y=-7.6;floor.receiveShadow=true;S.add(floor);

function rr(w,h,r){const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);
  s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
function ext(shape,depth){const g=new THREE.ExtrudeGeometry(shape,{depth:depth,bevelEnabled:true,bevelThickness:.15,bevelSize:.15,bevelSegments:2,curveSegments:8});g.translate(0,0,.15);return g;}
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
const plastic=new THREE.MeshStandardMaterial({color:0xd9dcdf,roughness:.38,metalness:.05});
const plastic2=new THREE.MeshStandardMaterial({color:0xdfe2e5,roughness:.36,metalness:.05});

// corpo, fundo e vedação
const bs=rr(7.7,13.7,.85);bs.holes.push(rr(7.3,13.3,.6));
S.add(new THREE.Mesh(ext(bs,3.1),plastic));
S.add(new THREE.Mesh(ext(rr(7.7,13.7,.85),.1),plastic));
const gk=new THREE.Mesh(ext(rr(7.8,13.8,.9),0),new THREE.MeshStandardMaterial({color:0x2b2e32,roughness:.8}));gk.position.z=3.25;S.add(gk);

// tampa

lid.add(new THREE.Mesh(ext(rr(8.0,14.0,.9),.9),plastic2));

[[-2.9,5.8],[2.9,5.8],[-2.9,-5.8],[2.9,-5.8]].forEach(function(p){
  const s=new THREE.Group();s.rotation.x=Math.PI/2;s.position.set(p[0],p[1],1.2);

const inn=new THREE.Group();inn.rotation.x=Math.PI/2;inn.position.set(0,0,1.4);S.add(inn);
function bx(w,h,d,col,px,py,pz,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial(Object.assign({color:col,roughness:.5,metalness:.15},o||{})));m.position.set(px,py,pz);inn.add(m);return m;}
function so(px,pz){const m=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1,14),new THREE.MeshStandardMaterial({color:0xb0b8c2,metalness:.8,roughness:.3}));m.position.set(px,-.5,pz);inn.add(m);}
function lab(txt,w,h,fg,px,py,pz){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:ctex(256,128,function(x,W,H){x.fillStyle=fg;x.font='bold 46px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,W/2,H/2);}),transparent:true}));m.rotation.x=-Math.PI/2;m.position.set(px,py,pz);inn.add(m);}
const ez=-3.2,mz=2.8;
bx(5.6,.15,2.8,0x141d28,0,0,ez);
bx(1.9,.3,1.7,0xcfd4da,-1,.22,ez,{metalness:.9,roughness:.25});lab('ESP32',1.5,.75,'#222',-1,.38,ez);
bx(1,.03,1.7,0x0b1118,-2.3,.1,ez);
bx(.8,.3,.6,0xdadee2,2.9,.22,ez,{metalness:.9,roughness:.25});
bx(.5,.2,.5,0x222222,1.6,.17,ez-.8);bx(.5,.2,.5,0x222222,1.6,.17,ez+.8);
bx(.15,.1,.15,0x30e060,.6,.12,ez+1,{emissive:0x10c040});
bx(4.8,.25,.25,0x111111,.2,-.2,ez-1.2);bx(4.8,.25,.25,0x111111,.2,-.2,ez+1.2);
[[-2.4,ez-1.1],[2.4,ez-1.1],[-2.4,ez+1.1],[2.4,ez+1.1]].forEach(function(p){so(p[0],p[1]);});

[[0xe03030,-.6],[0x151515,-.2],[0xe0c020,.2],[0x30b030,.6]].forEach(function(wc,i){
  const a=new THREE.Vector3(wc[1]-.3,-.2,ez+1.2),b=new THREE.Vector3(-.8+i*.35,-.1,mz-.65),m=a.clone().lerp(b,.5);m.y=-.5-i*.08;
  inn.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([a,m,b]),12,.05,5,false),new THREE.MeshStandardMaterial({color:wc[0],roughness:.5})));});
S.traverse(function(o){if(o.isMesh&&o.geometry.type==='ExtrudeGeometry')o.castShadow=true;});

// anotações
let sel=null,showN=true,ex=0,exGoal=0,fly=null,flyNote=null,drag=false,dirty=true,lastEx=-1;
const notes=[],bub=document.createElement('div');bub.id='bub';el.appendChild(bub);bub.onclick=function(){sel=null;};
function note(num,title,txt,par,p,nrm,inside){
  const a=new THREE.Object3D();a.position.set(p[0],p[1],p[2]);par.add(a);
  const d=document.createElement('div');d.className='pin';d.textContent=num;el.appendChild(d);
  const o={a:a,d:d,num:num,title:title,txt:txt,par:par,n:new THREE.Vector3(nrm[0],nrm[1],nrm[2]),inside:!!inside,vis:false,x:0,y:0};
  d.onclick=function(e){e.stopPropagation();sel=(sel===o)?null:o;};notes.push(o);}
note(1,'Tampa','Tampa cinza da caixa, presa por 4 parafusos. Use “Explodir” para ver a eletrônica.',lid,[4.2,3,.6],[1,0,0]);
[[-2.9,5.8],[2.9,5.8],[-2.9,-5.8],[2.9,-5.8]].forEach(function(p){note(2,'Parafuso M6','Um dos 4 parafusos M6 que fixam a tampa ao corpo da caixa.',lid,[p[0],p[1],1.45],[0,0,1]);});
note(3,'Logo MAGEN','Escudo com check e o nome YESOD: identidade visual do MAGEN (monitoramento de integridade estrutural).',lid,[1.7,3.0,1.3],[0,0,1]);
note(4,'Corpo da caixa','Corpo cinza que protege a eletrônica do sensor.',S,[4,-3,1.7],[1,0,0]);
note(5,'ESP32','Microcontrolador com Wi-Fi que lê o sensor e envia os dados.',inn,[0,.45,ez],[0,1,0],true);
note(6,'MPU6030','Acelerômetro e giroscópio que medem a inclinação e as vibrações da estrutura.',inn,[0,.45,mz],[0,1,0],true);
note(7,'Fios jumper','Ligam o ESP32 ao MPU6050 (alimentação e comunicação).',inn,[0,-.45,-.4],[0,1,0],true);
const chips=document.getElementById('chips'),bn=document.getElementById('bn'),sl=document.getElementById('sl'),seen={};
function pick(o){sel=o;flyNote=o;fly=null;exGoal=o.inside?1:0;showN=true;bn.classList.add('on');}
notes.forEach(function(o){if(seen[o.num])return;seen[o.num]=1;const b=document.createElement('button');b.className='chip';b.innerHTML='<i>'+o.num+'</i>'+(o.num===2?'Parafusos M6':o.title);b.onclick=function(){pick(o);};chips.appendChild(b);});
const _v=new THREE.Vector3(),_n=new THREE.Vector3(),_c=new THREE.Vector3(),_p=new THREE.Vector3();let bw=0,bh=0,lastSel=null;
function place(){
  const W=el.clientWidth,H=el.clientHeight;
  notes.forEach(function(o){
    o.a.getWorldPosition(_v);_n.copy(o.n).transformDirection(o.par.matrixWorld);_c.copy(C.position).sub(_v);
    const p=_p.copy(_v).project(C),ok=showN&&_n.dot(_c)>0&&p.z<1&&(!o.inside||ex>.25);
    o.vis=ok;o.d.style.display=ok?'flex':'none';o.d.classList.toggle('sel',o===sel);
    if(ok){o.x=(p.x*.5+.5)*W;o.y=(-p.y*.5+.5)*H;const tr='translate('+o.x.toFixed(1)+'px,'+o.y.toFixed(1)+'px)';if(o.s!==tr){o.d.style.transform=tr;o.s=tr;}}});
  if(sel&&sel.vis){if(sel!==lastSel){bub.innerHTML='<b>'+sel.num+' · '+sel.title+'</b>'+sel.txt;bub.style.display='block';bw=bub.offsetWidth;bh=bub.offsetHeight;lastSel=sel;}
    bub.style.left=Math.max(8,Math.min(sel.x+18,W-bw-8))+'px';
    bub.style.top=Math.max(64,Math.min(sel.y-10,H-bh-170))+'px';}else{bub.style.display='none';lastSel=null;}}
function view(k){const z=2+exGoal*5,d=34+exGoal*8,p=k==='f'?[0,0,z+d]:k==='l'?[d,0,z]:[.55*d,.27*d,z+.9*d];
  fly={p:new THREE.Vector3(p[0],p[1],p[2]),t:new THREE.Vector3(0,-1.2,z)};flyNote=null;}
document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){view(b.dataset.v);};});
document.getElementById('bx').onclick=function(){exGoal=exGoal>.5?0:1;this.textContent=exGoal?'Montar':'Explodir';view('i');};
sl.onpointerdown=function(){drag=true;};addEventListener('pointerup',function(){drag=false;});
sl.oninput=function(){ex=exGoal=sl.value/100;};
bn.onclick=function(){showN=!showN;bn.classList.toggle('on',showN);if(!showN)sel=null;};
document.getElementById('ba').onclick=function(){O.autoRotate=!O.autoRotate;this.classList.toggle('on',O.autoRotate);};
O.addEventListener('start',function(){fly=null;flyNote=null;});
function fit(){const w=el.clientWidth,h=el.clientHeight;R.setSize(w,h);C.aspect=w/h;C.fov=w/h<.8?52:38;C.updateProjectionMatrix();dirty=true;}
addEventListener('resize',fit);fit();
(function loop(){requestAnimationFrame(loop);
  ex+=(exGoal-ex)*.07;if(Math.abs(exGoal-ex)<.001)ex=exGoal;
  const mv=ex!==lastEx;if(!drag&&mv)sl.value=ex*100;
  if(mv){lastEx=ex;lid.position.set(ex*9,ex*2,3.4+ex*11);lid.rotation.y=ex*.35;inn.position.z=1.4+ex*5;R.shadowMap.needsUpdate=true;}
  const fl=!!(flyNote||fly);if(flyNote){const o=flyNote;o.a.getWorldPosition(_v);_n.copy(o.n).transformDirection(o.par.matrixWorld);
    const g=_v.clone().addScaledVector(_n,o.inside?13:11).add(new THREE.Vector3(2.5,2,0));
    C.position.lerp(g,.07);O.target.lerp(_v,.07);
    if(C.position.distanceTo(g)<.15&&Math.abs(ex-exGoal)<.02)flyNote=null;}
  else if(fly){C.position.lerp(fly.p,.07);O.target.lerp(fly.t,.07);if(C.position.distanceTo(fly.p)<.1)fly=null;}
  const ch=O.update();if(ch||mv||fl||dirty){R.render(S,C);dirty=false;}place();})();
